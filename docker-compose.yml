version: "3.8"

# Lab 5 — Lab 4 + Iceberg Lakehouse (Polaris + Trino + MinIO)

services:
  # ---------- Kafka stack (from lab3/lab4) ----------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [local-iceberg-lakehouse]

  broker1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: broker1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [local-iceberg-lakehouse]

  broker2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: broker2
    depends_on: [zookeeper]
    ports: ["9093:9093"]
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [local-iceberg-lakehouse]

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on: [broker1, broker2]
    entrypoint: >
      /bin/sh -c "
      cub kafka-ready -b broker1:29092 2 60;
      for t in Topic1 Topic2 avg-duration-per-day trips-count-per-day top-start-station-per-day top3-stations-per-day; do
        kafka-topics --bootstrap-server broker1:29092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 2;
      done;
      "
    networks: [local-iceberg-lakehouse]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on: [broker1, broker2]
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker1:29092,broker2:29093
    networks: [local-iceberg-lakehouse]

  producer:
    build: ./producer
    container_name: producer
    depends_on: [kafka-init]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker1:29092,broker2:29093
      TOPIC1: Topic1
      TOPIC2: Topic2
      CSV_PATH: /app/data/Divvy_Trips_2019_Q4.csv
      SEND_DELAY_MS: "0"
      MAX_ROWS: "0"
    networks: [local-iceberg-lakehouse]

  streams:
    build: ./streams
    container_name: streams
    depends_on: [kafka-init]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker1:29092,broker2:29093
      INPUT_TOPIC: Topic1
      APP_ID: trips-streams-app
    networks: [local-iceberg-lakehouse]

  # ---------- Lakehouse stack ----------
  polaris:
    image: apache/polaris:latest
    platform: linux/amd64
    container_name: polaris
    ports:
      - "8181:8181"
      - "8182:8182"
    networks: [local-iceberg-lakehouse]
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: dummy-region
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ENDPOINT_URL_STS: http://minio:9000
      POLARIS_BOOTSTRAP_CREDENTIALS: default-realm,root,secret
      polaris.features.DROP_WITH_PURGE_ENABLED: "true"
      polaris.realm-context.realms: default-realm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 5

  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8080:8080"
    environment:
      - TRINO_JVM_OPTS=-Xmx1G
    networks: [local-iceberg-lakehouse]
    volumes:
      - ./trino/catalog:/etc/trino/catalog

  minio:
    image: minio/minio:latest
    container_name: minio
    volumes:
      - ./minio_data:/data
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: dummy-region
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    networks:
      local-iceberg-lakehouse:
        aliases:
          - warehouse.minio
    ports:
      - "9001:9001"
      - "9000:9000"
    command: ["server", "/data", "--console-address", ":9001"]

  minio-client:
    image: minio/mc:latest
    container_name: minio-client
    depends_on: [minio]
    networks: [local-iceberg-lakehouse]
    volumes:
      - /tmp:/tmp
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: dummy-region
    entrypoint: >
      /bin/sh -c "
      until (mc alias set minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      mc rm -r --force minio/warehouse || true;
      mc mb minio/warehouse;
      mc anonymous set public minio/warehouse;
      tail -f /dev/null
      "

networks:
  local-iceberg-lakehouse:
    name: local-iceberg-lakehouse
